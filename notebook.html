<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>筆記本</title>
<style>
:root{--bg:#fff;--side:#f5f6f7;--ink:#1b1f24;--mute:#8a939b;--line:#e3e6e8;--sel:#e6edf8;--accent:#2f6fed;--on:#fff;--danger:#d64545;
  --font:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191c;--side:#1e2125;--ink:#e9ecef;--mute:#80898f;--line:#2b2f34;--sel:#26354d;--accent:#6c9bff;--on:#0b1220;--danger:#ff7b7b}}
:root[data-theme="dark"]{--bg:#17191c;--side:#1e2125;--ink:#e9ecef;--mute:#80898f;--line:#2b2f34;--sel:#26354d;--accent:#6c9bff;--on:#0b1220;--danger:#ff7b7b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:300px 1fr;height:100%}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.head{position:relative;display:flex;align-items:center;gap:8px;padding:16px 16px 8px}
.head h1{flex:1;margin:0;font-size:20px}
.btn{border:0;border-radius:8px;background:transparent;padding:7px 12px;color:var(--mute);transition:background .15s,color .15s,transform .1s}
.btn:hover{background:var(--sel);color:var(--ink)}
.btn.main{background:var(--accent);color:var(--on);font-weight:600}
.btn.main:hover{background:var(--accent);filter:brightness(1.1)}
.btn.del:hover{color:var(--danger)}
.btn:active{transform:scale(.96)}
.menu{position:absolute;z-index:10;top:100%;left:12px;right:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.18);transform-origin:50% 0;animation:menuIn .28s cubic-bezier(.2,.8,.2,1)}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:10px 12px}
.menu button:hover{background:var(--sel)}
.menu b{display:block}.menu span{display:block;font-size:13px;color:var(--mute)}
.q{margin:4px 16px 8px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.rows{flex:1;overflow-y:auto;list-style:none;margin:0;padding:0 8px 16px}
.rows li{overflow:hidden;max-height:120px;transition:transform .2s ease-out}
.rows li.add{animation:cardIn .55s cubic-bezier(.2,.8,.2,1) backwards;transform-origin:50% 0}
.rows li.spin{animation:spin .7s cubic-bezier(.3,.7,.2,1) backwards}
.rows li.out{animation:out .4s ease forwards;transform-origin:50% 0}
.rows li.grp{max-height:none;padding:10px 12px 4px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--mute)}
.row{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:10px 12px}
.row:hover,.row[aria-current="true"]{background:var(--sel)}
.row b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row span{display:block;color:var(--mute);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-style:normal;font-size:12px;font-weight:500;padding:1px 8px;border-radius:99px;margin-right:6px;--c:var(--accent);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.tag[data-t=code]{--c:#12a37f}.tag[data-t=todo]{--c:#d9822b}
.none{padding:32px 16px;text-align:center;color:var(--mute)}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;align-items:center;gap:4px;padding:10px 20px;border-bottom:1px solid var(--line)}
.st{flex:1;color:var(--mute);font-size:13px}
.st:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.st.sv:before{background:var(--mute);animation:beat .8s infinite}
.back{display:none}
.scroll{flex:1;overflow-y:auto;padding:40px 24px 80px}
.sheet{max-width:680px;margin:0 auto;transform-origin:0 50%;animation:flipIn .55s cubic-bezier(.2,.8,.2,1)}
.kind{margin-bottom:8px}
.ti{width:100%;border:0;border-bottom:1px dashed var(--line);background:transparent;font:700 30px/1.3 var(--font);padding:0 0 8px;margin-bottom:16px;outline:none;transition:border-color .15s}
.ti:focus{border-bottom-color:var(--accent)}
.bd{display:block;width:100%;border:0;background:transparent;resize:none;outline:none;font-size:18px;line-height:1.9;padding:0;min-height:55vh}
.ti::placeholder,.bd::placeholder,.cb::placeholder,.addi::placeholder{color:var(--mute)}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--mute);padding:24px}
.empty p{margin:0 0 16px}
/* code */
.code{background:#0f1720;color:#e2e8f0;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.16)}
.ch{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #1f2b38}
.ch select{background:#18222e;color:#cbd5e1;border:1px solid #2a3947;border-radius:6px;padding:4px 8px;font-size:13px}
.cp{border:0;background:#2f6fed;color:#fff;border-radius:8px;padding:7px 16px;font-size:14px;font-weight:600;transition:background .15s,transform .1s}
.cp.ok{background:#12a37f}
.rows li{position:relative}
.row.hc b{padding-right:60px}
.rc{position:absolute;right:10px;top:9px;border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:6px;font-size:12px;padding:1px 8px;opacity:0;transition:opacity .15s,background .15s}
.rows li:hover .rc,.rc:focus-visible,.rc.ok{opacity:1}
.rc:hover{color:var(--ink);border-color:var(--accent)}
.rc.ok{background:#12a37f;border-color:#12a37f;color:#fff}
@media (hover:none){.rc{opacity:1}}
.cp:hover{filter:brightness(1.12)}.cp:active{transform:scale(.96)}
.cw{display:flex}
.ln{margin:0;padding:14px 10px 14px 14px;color:#566678;text-align:right;font:14px/1.7 var(--mono);user-select:none}
.cb{flex:1;min-width:0;min-height:240px;border:0;background:transparent;color:inherit;outline:none;resize:none;white-space:pre;overflow-x:auto;overflow-y:hidden;font:14px/1.7 var(--mono);padding:14px}
/* todo */
.prog{color:var(--mute);font-size:14px;margin-bottom:8px}
.it{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);transform-origin:50% 0}
.it.in{animation:itemIn .38s cubic-bezier(.2,.8,.2,1)}
.it.gone{animation:itemOut .26s ease forwards}
.ck{position:relative;display:grid}
.ck input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--mute);display:grid;place-items:center;transition:background .15s,border-color .15s}
.ck input:checked+.box{background:var(--accent);border-color:var(--accent)}
.ck input:checked+.box:after{content:"";width:5px;height:10px;border:solid var(--on);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck input:focus-visible+.box{outline:2px solid var(--accent);outline-offset:2px}
.box.flip{animation:coin .5s ease}
.tx{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:17px;padding:4px 0}
.it.done .tx{color:var(--mute);text-decoration:line-through}
.x{border:0;background:transparent;color:var(--mute);opacity:0;border-radius:6px;padding:4px 8px}
.it:hover .x,.x:focus-visible{opacity:1}.x:hover{color:var(--danger)}
@media (hover:none){.x{opacity:.6}}
.addi{width:100%;margin-top:10px;border:1px dashed var(--line);border-radius:8px;background:transparent;padding:10px 12px;outline:none}
.addi:focus{border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tabs{display:flex;gap:4px;margin:4px 16px 8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{flex:1;border:0;background:transparent;border-radius:7px;padding:6px;color:var(--mute);transition:background .15s,color .15s}
.tabs button[aria-pressed="true"]{background:var(--sel);color:var(--ink);font-weight:600}
.tabs small{color:var(--mute);font-size:12px}
.tinfo{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px 8px;font-size:13px;color:var(--mute)}
.tinfo[hidden]{display:none}
.toast.on.act{pointer-events:auto}
.toast .ta{margin-left:14px;border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;padding:0}
.sheet [disabled]{opacity:.7;cursor:default}
.cats{display:flex;gap:6px;margin:0 16px 8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.cats[hidden],.cmgr[hidden]{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 12px;font-size:14px;color:var(--mute);transition:background .15s,color .15s,border-color .15s,transform .1s}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.chip.add{border-style:dashed}
.chip.new{animation:chipIn .45s cubic-bezier(.2,.8,.2,1);transform-origin:50% 0}
.chip small{opacity:.7}
.cin{flex:none;width:130px;border:1px solid var(--accent);border-radius:99px;padding:3px 12px;font-size:14px;background:var(--bg);outline:none}
.cmgr{display:flex;gap:4px;margin:0 16px 8px}
.cmgr .btn{padding:3px 10px;font-size:13px}
.cn{font-style:normal;font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:0 7px;margin-right:6px}
.csel{max-width:120px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;font-size:14px;margin-right:4px}
@keyframes chipIn{from{opacity:0;transform:perspective(500px) rotateX(-90deg)}to{opacity:1;transform:perspective(500px)}}
.sync{position:relative}
.sync i{position:absolute;right:3px;top:3px;width:8px;height:8px;border-radius:50%}
.sync[data-s=ok] i{background:#12a37f}
.sync[data-s=err] i{background:var(--danger)}
.sync[data-s=sync] i{background:var(--accent);animation:beat .7s infinite}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.45);display:grid;place-items:center;padding:16px;overflow-y:auto}
.ov[hidden]{display:none}
.dlg{width:100%;max-width:520px;max-height:100%;overflow-y:auto;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:dlgIn .45s cubic-bezier(.2,.8,.2,1)}
.dlg h2{margin:0 0 6px;font-size:20px}
.dlg p{margin:0 0 12px;color:var(--mute);font-size:14px}
.dlg ol{margin:0 0 12px;padding-left:20px;font-size:14px}
.dlg li{margin-bottom:10px}
.dlg pre{margin:6px 0;background:var(--side);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:12px/1.5 var(--mono);overflow-x:auto}
.dlg textarea,.dlg .fi{display:block;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--side);padding:8px 10px;font:13px/1.5 var(--mono);color:var(--ink);outline:none;margin-top:6px}
.dlg textarea{min-height:84px;resize:vertical}
.dlg textarea:focus,.dlg .fi:focus{border-color:var(--accent)}
.dlg .btn{border:1px solid var(--line)}
.dlg .btn.main{border-color:var(--accent)}
.dlg .r2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:14px}
.dlg code{font:13px var(--mono);background:var(--side);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.dlg .dw{font-size:13px;background:var(--sel);border-radius:8px;padding:8px 10px;margin-bottom:12px}
.dlg .de{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:6px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@keyframes dlgIn{from{opacity:0;transform:perspective(900px) rotateX(-18deg) translateY(12px)}to{opacity:1;transform:perspective(900px)}}
@keyframes cardIn{from{opacity:0;transform:perspective(700px) rotateX(-80deg)}to{opacity:1;transform:perspective(700px) rotateX(0)}}
@keyframes spin{from{transform:perspective(700px) rotateY(0)}to{transform:perspective(700px) rotateY(360deg)}}
@keyframes out{50%{opacity:0;transform:perspective(700px) rotateX(80deg);max-height:120px}to{opacity:0;transform:perspective(700px) rotateX(80deg);max-height:0}}
@keyframes flipIn{from{opacity:0;transform:perspective(1200px) rotateY(-16deg) rotateX(5deg) translateZ(-60px)}to{opacity:1;transform:perspective(1200px)}}
@keyframes menuIn{from{opacity:0;transform:perspective(700px) rotateX(-28deg) translateY(-6px)}to{opacity:1;transform:perspective(700px)}}
@keyframes itemIn{from{opacity:0;transform:perspective(600px) rotateX(-60deg)}to{opacity:1;transform:perspective(600px)}}
@keyframes itemOut{to{opacity:0;transform:perspective(600px) rotateX(60deg)}}
@keyframes coin{from{transform:perspective(200px) rotateY(0)}to{transform:perspective(200px) rotateY(360deg)}}
@keyframes beat{50%{opacity:.25}}
@media (max-width:700px){
  .app{grid-template-columns:1fr}
  .pane{display:none}
  .app.editing .side{display:none}
  .app.editing .pane{display:flex}
  .back{display:inline-block}
  .bar{padding:8px 12px}.scroll{padding:24px 18px 80px}.ti{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="head">
      <h1>筆記本</h1>
      <button class="btn" id="theme" aria-label="切換深色或淺色">◐</button>
      <button class="btn sync" id="sync" aria-label="雲端同步" data-s="off">☁<i></i></button>
      <button class="btn main" id="new" aria-haspopup="true" aria-expanded="false">＋ 新增</button>
      <div class="menu" id="menu" hidden>
        <button data-t="text"><b>文字筆記</b><span>想法、日記、隨手記</span></button>
        <button data-t="code"><b>程式碼</b><span>有行號，可一鍵複製</span></button>
        <button data-t="todo"><b>待辦清單</b><span>可勾選的項目</span></button>
      </div>
    </div>
    <div class="tabs" role="group" aria-label="檢視"><button data-v="notes" aria-pressed="true">筆記 <small id="cN"></small></button><button data-v="trash" aria-pressed="false">垃圾桶 <small id="cT"></small></button></div>
    <div class="cats" id="cats"></div><div class="cmgr" id="cmgr" hidden></div>
    <input class="q" id="q" type="search" placeholder="搜尋" aria-label="搜尋筆記">
    <div class="tinfo" id="tinfo" hidden><span>30 天後自動永久刪除</span><button class="btn" id="et">清空垃圾桶</button></div>
    <ul class="rows" id="rows"></ul>
  </aside>
  <section class="pane" id="pane"></section>
</div>
<div class="ov" id="ov" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dt"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
var KEY='mopage-v1',notes=[],cur=null,query='',newId=null,spinId=null,first=true,view='notes',cats=[],catF='all',editCat=null,newCatId=null,tomb={},cfg=null,busy=false,pT=null,snap={},showKey=false;
var TY={text:'文字',code:'程式碼',todo:'待辦'};
var LANGS=['JavaScript','Python','HTML/CSS','SQL','Bash','C/C++','Java','其他'];
var RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
var $=function(i){return document.getElementById(i)};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function norm(n){n.type=TY[n.type]?n.type:'text';n.items=Array.isArray(n.items)?n.items:[];n.lang=n.lang||'JavaScript';n.body=n.body||'';n.title=n.title||'';n.deleted=n.deleted||0;n.cat=n.cat||'';n.v=n.v||n.updated||Date.now();return n}
function getCat(id){for(var i=0;i<cats.length;i++)if(cats[i].id===id)return cats[i]}
function saveCats(){if(!persist())toast('無法儲存分類');sched()}
function load(){try{tomb=JSON.parse(localStorage.getItem('mopage-tomb'))||{}}catch(e){tomb={}}
  try{cfg=JSON.parse(localStorage.getItem('mopage-sync'))}catch(e){cfg=null}
  try{cats=JSON.parse(localStorage.getItem('mopage-cats'))||[]}catch(e){cats=[]}
  if(!Array.isArray(cats))cats=[];cats=cats.filter(function(c){return c&&c.id&&c.name});
  try{notes=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){notes=[]}
  if(!notes.length&&!cfg){var t=Date.now();notes=[
    {id:'s-welcome',type:'text',title:'歡迎使用',pinned:true,updated:t-2,body:'這是一般文字筆記。\n\n按左上角「＋ 新增」可以選：文字、程式碼、待辦清單。\n釘選的筆記會固定在列表最上面。'},
    {id:'s-code',type:'code',title:'防抖函式 debounce',lang:'JavaScript',updated:t-1,body:'function debounce(fn, ms) {\n  let t;\n  return (...args) => {\n    clearTimeout(t);\n    t = setTimeout(() => fn(...args), ms);\n  };\n}'},
    {id:'s-todo',type:'todo',title:'這週要做',updated:t,items:[{t:'新增第一則筆記',d:false},{t:'試試置頂和待辦',d:true}]}]}
  notes.forEach(norm);notes.forEach(function(n){if(n.cat&&!getCat(n.cat))n.cat=''});var cut=Date.now()-30*864e5;notes=notes.filter(function(n){if(n.deleted&&n.deleted<=cut){tomb[n.id]=Date.now();return false}return true});pruneTomb();resnap()}
function jn(n){return JSON.stringify(n,function(k,v){return k==='v'?undefined:v})}
function resnap(){snap={};notes.forEach(function(n){snap[n.id]=jn(n)})}
function stamp(){notes.forEach(function(n){var j=jn(n);if(snap[n.id]!==j){if(snap[n.id]!==undefined)n.v=Date.now();snap[n.id]=j}})}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(notes));localStorage.setItem('mopage-cats',JSON.stringify(cats));localStorage.setItem('mopage-tomb',JSON.stringify(tomb));return true}catch(e){return false}}
function pruneTomb(){var c=Date.now()-90*864e5;Object.keys(tomb).forEach(function(k){if(tomb[k]<c)delete tomb[k]})}
function sched(){if(!cfg||busy)return;clearTimeout(pT);pT=setTimeout(function(){syncNow()},2500)}
function save(){stamp();if(!persist())toast('無法儲存：瀏覽器儲存空間不可用');sched()}
function toast(t,a,fn){var e=$('toast');e.textContent=t;e.classList.remove('act');
  if(a){var b=document.createElement('button');b.className='ta';b.textContent=a;b.onclick=function(){fn();e.classList.remove('on')};e.appendChild(b);e.classList.add('act')}
  e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},a?5000:1800)}
function get(id){for(var i=0;i<notes.length;i++)if(notes[i].id===id)return notes[i]}
function snip(n){
  if(n.type==='todo'){var d=n.items.filter(function(i){return i.d}).length;return n.items.length?'完成 '+d+'/'+n.items.length+' · '+n.items[0].t:'空清單'}
  if(n.type==='code'){var l=n.body.split('\n').filter(function(x){return x.trim()})[0];return l?l.trim():'沒有內容'}
  return n.body.replace(/\s+/g,' ').trim()||'沒有內容'}
function renderList(){
  var q=query.toLowerCase(),ul=$('rows');ul.innerHTML='';
  var rows=notes.filter(function(n){if(view==='trash'?!n.deleted:!!n.deleted)return false;if(view==='notes'&&catF!=='all'&&n.cat!==catF)return false;return !q||(n.title+'\n'+n.body+'\n'+n.items.map(function(i){return i.t}).join('\n')).toLowerCase().indexOf(q)>-1})
    .sort(function(a,b){return view==='trash'?b.deleted-a.deleted:(!!b.pinned-!!a.pinned)||(b.updated-a.updated)});
  if(!rows.length){var e=document.createElement('div');e.className='none';e.textContent=q?'找不到符合的筆記':view==='trash'?'垃圾桶是空的':catF!=='all'?'這個分類還沒有筆記':'還沒有筆記，按右上角「新增」';ul.appendChild(e);return}
  var pins=view==='trash'?0:rows.filter(function(n){return n.pinned}).length,last=null;
  rows.forEach(function(n,i){

document.addEventListener('keydown',function(e){if(e.key==='Escape'){setMenu(false);closeDlg()}});
$('sync').onclick=function(){$('ov').hidden=false;renderDlg()};
$('ov').onclick=function(e){if(e.target===this)closeDlg()};
document.addEventListener('visibilitychange',function(){if(!document.hidden&&cfg)syncNow()});
setInterval(function(){if(cfg&&!document.hidden)syncNow()},60000);
document.querySelector('.tabs').onclick=function(e){var b=e.target.closest('button[data-v]');if(!b||b.dataset.v===view)return;
  view=b.dataset.v;cur=null;first=true;$('app').classList.remove('editing');renderAll()};
arm($('et'),'清空垃圾桶',function(){notes=notes.filter(function(n){if(n.deleted){tomb[n.id]=Date.now();return false}return true});cur=null;save();renderAll();toast('已清空垃圾桶')});
$('q').oninput=function(){query=this.value;renderList()};
$('theme').onclick=function(){var r=document.documentElement,d=r.getAttribute('data-theme'),dark=d?d==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.setAttribute('data-theme',dark?'light':'dark')};
load();save();
if(innerWidth>700){var f=notes.filter(function(n){return !n.deleted}).sort(function(a,b){return (!!b.pinned-!!a.pinned)||(b.updated-a.updated)})[0];if(f)cur=f.id}
renderAll();
if(cfg)syncNow();
})();
</script>
</body>
</html>
